name: mosaic-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
    ports:
      - "5436:5432"
    volumes:
      - mosaic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "1026:1025"
      - "8026:8025"
    restart: unless-stopped

  warehouse:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mosaic_warehouse
      POSTGRES_USER: mosaic_warehouse_admin
      POSTGRES_PASSWORD: mosaic
    ports:
      - "5437:5432"
    volumes:
      - mosaic-warehouse:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic_warehouse_admin -d mosaic_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mosaic-postgres:
  mosaic-warehouse:
